<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Katsuya Shiratori</title>
  <meta name="robots" content="noindex">
  <!-- Browser-chrome colour (kept in sync with the active theme by the scripts below) -->
  <meta name="theme-color" content="#faf6ef">
  <!-- Root-absolute paths so the error page renders for unmatched URLs at any depth. -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Newsreader:opsz,wght@6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : null;
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        var dark = theme ? theme === 'dark'
                   : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#161310' : '#faf6ef');
      } catch (e) {}
    })();
  </script>
  <style>
    .notfound { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: var(--sp-4); }
    .notfound .code { font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.2em; }
    .notfound h1 { font-size: var(--fs-600); margin: 0; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="masthead" href="/">
        <span class="masthead__name">Katsuya&nbsp;Shiratori</span><span class="masthead__suffix">Ph.D.</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/publications.html">Publications</a>
        <a href="/races.html">Races</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme">
          <svg class="theme-toggle__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle class="sun" cx="12" cy="12" r="4"></circle>
            <g class="sun-rays" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line>
              <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"></line><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"></line>
              <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"></line><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"></line>
            </g>
            <path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"></path>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap notfound">
    <p class="code label">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn&rsquo;t exist or has moved.</p>
    <p><a href="/">&larr; Back home</a></p>
  </main>

  <script src="/assets/main.js" defer></script>
</body>
</html>
